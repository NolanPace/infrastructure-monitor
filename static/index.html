<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>InfraWatch · Local Uptime Monitor</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#090f1d;color:#e2e8f0}*{box-sizing:border-box}body{margin:0}header{padding:32px clamp(22px,6vw,90px);border-bottom:1px solid #243047;background:linear-gradient(110deg,#101b30,#0a1828)}h1{font-size:2.2rem;margin:.25em 0}p{color:#9cabc3}main{max-width:1100px;padding:28px;margin:auto}#stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stat,.card{border:1px solid #27364f;background:#131f32;border-radius:14px;padding:24px}.stat strong{display:block;font-size:2rem;margin-top:6px}.muted{color:#9cabc3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-top:24px}small{font-size:.85rem}.up{color:#4ade80}.down{color:#fb7185}.pill{border-radius:100px;background:#233552;padding:5px 12px;font-size:.8rem}.bar{height:7px;background:#283953;border-radius:10px;margin:22px 0 12px;overflow:hidden}.fill{height:100%;background:#36ca93}a{color:#93c5fd;overflow-wrap:anywhere}button{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:#2b83f6;color:white}button:hover{background:#4da3ff}@media(max-width:600px){#stats{grid-template-columns:1fr}}
</style></head><body><header><span class="pill">LOCAL MONITORING</span><h1>InfraWatch</h1><p>Endpoint availability, response times and history — updated every 10 seconds.</p></header><main><div id="stats"><div class="stat">Targets<strong id="count">—</strong></div><div class="stat">Healthy<strong id="up" class="up">—</strong></div><div class="stat">Uptime (latest check)<strong id="rate">—</strong></div></div><section class="grid" id="cards" aria-live="polite"></section><p class="muted"><small>History is stored locally in SQLite. HTTP checks are configured in targets.example.json. This dashboard binds to localhost only.</small></p></main><script>
const cards=document.getElementById('cards');
function element(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
async function refresh(){try{const response=await fetch('/api/status');if(!response.ok)throw Error('Could not load status');const data=await response.json();document.getElementById('count').textContent=data.length;const healthy=data.filter(d=>d.ok).length;document.getElementById('up').textContent=healthy;document.getElementById('rate').textContent=data.length?Math.round(100*healthy/data.length)+'%':'—';cards.replaceChildren();for(const t of data){const card=element('article','','card');card.append(element('span',t.ok?'● OPERATIONAL':'● UNAVAILABLE',t.ok?'up':'down'),element('h2',t.name));const link=document.createElement('a');link.href=t.url;link.textContent=t.url;link.rel='noopener noreferrer';link.target='_blank';card.append(link,element('p',t.latency_ms+' ms · HTTP '+(t.status??'error'),'muted'));if(t.error)card.append(element('small',t.error,'down'));card.append(element('div','','bar'));const fill=element('div','','fill');fill.style.width=t.ok?'100%':'0%';card.lastChild.append(fill);card.append(element('small','Last checked: '+new Date(t.timestamp).toLocaleString(),'muted'));cards.append(card)}}catch(error){cards.replaceChildren(element('p',error.message,'down'))}}
refresh();setInterval(refresh,10000);
</script></body></html>
